<main class="login-page">
  <section class="login-card">

    <a routerLink="/" class="back-link">
      ← Voltar ao mercado
    </a>

    <div class="brand">
      <img
        src="/assets/mascot/mascot-heart.png"
        alt="Castorzinho segurando um coração"
        class="auth-mascot"
      />

      <h1>Coração Market</h1>

      <p>
        Seu mercado de sempre, agora mais pertinho!
      </p>
    </div>

    <div class="form-heading">
      <h2>Bem-vindo de volta!</h2>
      <p>Entre na sua conta para continuar suas compras.</p>
    </div>

    <form (ngSubmit)="login()" #loginForm="ngForm">

      <div class="form-group">
        <label for="email">E-mail</label>

        <input
          id="email"
          type="email"
          name="email"
          [(ngModel)]="email"
          placeholder="seuemail@exemplo.com"
          autocomplete="email"
          required
          email
        />
      </div>

      <div class="form-group">
        <label for="password">Senha</label>

        <input
          id="password"
          type="password"
          name="password"
          [(ngModel)]="password"
          placeholder="Digite sua senha"
          autocomplete="current-password"
          required
        />
      </div>

      @if (error()) {
        <div class="error-message" role="alert">
          {{ error() }}
        </div>
      }

      <button
        type="submit"
        class="login-button"
        [disabled]="loginForm.invalid || loading()"
      >
        @if (loading()) {
          Entrando...
        } @else {
          Entrar
        }
      </button>

    </form>

    <div class="register-link">
    <span>Ainda não tem uma conta?</span>

    <a
        routerLink="/register"
        [queryParams]="returnUrl ? { returnUrl: returnUrl } : {}"
    >
        Criar minha conta
    </a>
    </div>

  </section>
</main>
