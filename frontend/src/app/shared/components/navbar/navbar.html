<header class="navbar">
  <div class="navbar-container">

    <!-- Menu lateral -->
    <button
      class="menu-toggle"
      type="button"
      aria-label="Abrir categorias e filtros"
      (click)="menuToggle.emit()"
    >
      ☰
    </button>

    <!-- Marca -->
    <a class="brand" routerLink="/">
      <span class="brand-icon">🦫</span>

      <div class="brand-text">
        <strong>Coração Market</strong>
        <small>Você no coração da gente</small>
      </div>
    </a>

    <!-- Pesquisa -->
    <div class="search">
      <label class="sr-only" for="product-search">
        Pesquisar produtos
      </label>

      <input
        id="product-search"
        type="search"
        placeholder="O que você procura hoje?"
        [ngModel]="search"
        (ngModelChange)="onSearchChange($event)"
      />

      <span aria-hidden="true">⌕</span>
    </div>

    <!-- Conta e carrinho -->
    <nav class="actions" aria-label="Navegação da conta">

      @if (isAuthenticated()) {

        <!-- Usuário autenticado -->
        <div class="account-user">
          <span aria-hidden="true">👤</span>

          <span class="account-name">
            Olá, {{ currentUser()?.name }}
          </span>

          <button
            type="button"
            class="logout-button"
            (click)="logout()"
          >
            Sair
          </button>
        </div>

      } @else {

        <!-- Visitante -->
        <a routerLink="/login" class="account">
          <span aria-hidden="true">👤</span>
          <span>Entrar</span>
        </a>

      }

      <!-- Carrinho -->
      <a routerLink="/cart" class="cart">
        <span aria-hidden="true">🛒</span>
        <span>Carrinho</span>

        @if (cartCount > 0) {
          <span class="cart-count">
            {{ cartCount }}
          </span>
        }
      </a>

    </nav>

  </div>
</header>
